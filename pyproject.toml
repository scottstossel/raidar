[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raidar"
version = "0.1.0"
description = "High-quality AI research signal without the noise"
requires-python = ">=3.10"
authors = [{name = "Scott Stossel", email = "stoss96@gmail.com"}]

dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.12",
  "psycopg2-binary>=2.9",
  "fastapi>=0.104",
  "uvicorn>=0.24",
  "httpx>=0.25",
  "requests>=2.31",
  "anthropic>=0.25",
  "pinecone-client>=3.0",
  "langfuse>=3.0",
  "mlflow>=2.9",
  "apache-airflow>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.21",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.6",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
